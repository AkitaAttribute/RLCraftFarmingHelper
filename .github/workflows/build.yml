name: Build Mod

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select build toolchain
        id: toolchain
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "1.21.1-NeoForge" ]] || grep -q "net.neoforged.moddev" build.gradle; then
            echo "java=21" >> "$GITHUB_OUTPUT"
            echo "gradle=8.10.2" >> "$GITHUB_OUTPUT"
            echo "artifact=rlcraft-farming-helper-neoforge-1.21.1" >> "$GITHUB_OUTPUT"
          else
            echo "java=8" >> "$GITHUB_OUTPUT"
            echo "gradle=4.10.3" >> "$GITHUB_OUTPUT"
            echo "artifact=rlcraft-farming-helper-forge-1.12.2" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          gradle clean build --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: error

      - name: Upload mod jar
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.toolchain.outputs.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Fail job when Gradle fails
        if: steps.build.outputs.status != '0'
        run: exit 1
